# ─────────────────────────────────────────────────────────────────────────────
# Sample Wallet APK Release Workflow
#
# Always maintains a single "latest" release with the most recent APK.
# Trigger manually via workflow_dispatch or on push to develop branch.
#
# Required repo setup:
#   1. Repository secrets:
#      - E2E_REOWN_PROJECT_ID
#      - E2E_WALLET_PRIVATE_KEY
#
# Output: a GitHub Release tagged "latest" with one APK:
#   - sample-wallet.apk
#
# The consuming wallet-flutter workflow downloads with:
#   gh release download latest --repo worpt-wallet/reown_flutter --pattern "sample-wallet.apk"
# ─────────────────────────────────────────────────────────────────────────────

name: Release Sample Wallet APK

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: sample-wallet-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.caching=true
        -Dkotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: >-
            pub-${{ runner.os }}-reown-
            ${{ hashFiles('packages/reown_walletkit/example/pubspec.lock') }}

      - name: Flutter setup
        working-directory: packages/reown_walletkit/example
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: packages/reown_walletkit/example
        env:
          E2E_REOWN_PROJECT_ID: ${{ secrets.E2E_REOWN_PROJECT_ID }}
          E2E_WALLET_PRIVATE_KEY: ${{ secrets.E2E_WALLET_PRIVATE_KEY }}
        run: |
          flutter build apk \
            --flavor internal \
            --debug \
            --no-pub \
            --android-skip-build-dependency-validation \
            --dart-define="PROJECT_ID=$E2E_REOWN_PROJECT_ID" \
            --dart-define="ENABLE_TEST_MODE=true" \
            --dart-define="TEST_WALLET_PRIVATE_KEY=$E2E_WALLET_PRIVATE_KEY"

      - name: Collect APK
        run: |
          mkdir -p /tmp/apks
          cp packages/reown_walletkit/example/build/app/outputs/flutter-apk/*.apk \
            /tmp/apks/sample-wallet.apk

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          
          # Delete existing release if it exists
          if gh release view "$TAG" &>/dev/null; then
            gh release delete "$TAG" --yes
          fi
          
          # Delete the tag if it exists
          if git rev-parse "$TAG" &>/dev/null; then
            git push origin ":refs/tags/$TAG" || true
          fi
          
          # Create new release
          gh release create "$TAG" \
            --title "Sample Wallet APK — Latest" \
            --notes "Auto-built sample wallet APK for e2e tests. Always reflects the latest build from develop branch." \
            /tmp/apks/*.apk
